[versions]
minecraft = "1.21.1"

parchment-mc = "1.21.1"
parchment-map = "2024.11.17"

neo-moddev = "2.0.141"
neo-version = "21.1.240"
kff-version = "5.12.0"

kotlin = "2.4.0"
dokka = "2.1.0"
spotless = "7.2.1"

axion-release = "1.21.2"
maven-publish = "0.37.0"
mod-publish = "2.1.1"

ae2 = "19.2.17"
curios = "9.5.1+1.21.1"
dire = "7463040"
immersive = "1.21.1-12.4.2-194"
jade = "15.10.5+neoforge"
jei = "19.39.0.368"
mek = "1.21.1-10.7.19.85"
mi = "2.5.3"
moonlight = "1.21.1-3.1.1"
oritech = "1.2.9"
replica = "1.21-1.2.7"

[libraries]

kff = { group = "thedarkcolour", name = "kotlinforforge-neoforge", version.ref = "kff-version" }

ae2 = { group = "org.appliedenergistics", name = "appliedenergistics2", version.ref = "ae2" }
curios = { group = "top.theillusivec4.curios", name = "curios-neoforge", version.ref = "curios" }
dire = { group = "curse.maven", name = "just-dire-things-1002348", version.ref = "dire" }
immersive = { group = "blusunrize.immersiveengineering", name = "ImmersiveEngineering", version.ref = "immersive" }
jade = { group = "maven.modrinth", name = "jade", version.ref = "jade" }
jei = { group = "mezz.jei", name = "jei-1.21.1-neoforge", version.ref = "jei" }
jei-api = { group = "mezz.jei", name = "jei-1.21.1-neoforge-api", version.ref = "jei" }
mek = { group = "mekanism", name = "Mekanism", version.ref = "mek" }
mi = { group = "aztech", name = "Modern-Industrialization", version.ref = "mi" }
moonlight = { group = "net.mehvahdjukaar", name = "moonlight-common", version.ref = "moonlight" }
moonlight-neo = { group = "net.mehvahdjukaar", name = "moonlight-neoforge", version.ref = "moonlight" }
moonlight-runtime = { group = "maven.modrinth", name = "moonlight", version = "moonlight" }
oritech = { group = "rearth.oritech", name = "oritech-neoforge-1.21.1", version.ref = "oritech" }
replica = { group = "maven.modrinth", name = "replication", version.ref = "replica" }

[bundles]

common-impl = [
    "jade",
    "jei-api",
    "moonlight-neo"
]

common-compile = []

common-runtime = []

integration-impl = [
    "ae2",
    "curios",
    "dire",
    "immersive",
    "oritech",
    "replica",
]

integration-compile = []

integration-runtime = [
    "jei"
]

[plugins]

neo-moddev = { id = "net.neoforged.moddev", version.ref = "neo-moddev" }

kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
dokka-javadoc = { id = "org.jetbrains.dokka-javadoc", version.ref = "dokka" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

axion-release = { id = "pl.allegro.tech.build.axion-release", version.ref = "axion-release" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
mod-publish = { id = "me.modmuss50.mod-publish-plugin", version.ref = "mod-publish" }
